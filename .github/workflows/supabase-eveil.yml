name: Garder Supabase éveillé

# Un projet Supabase gratuit se met en pause après une semaine sans activité.
# Ce passage, le lundi et le jeudi, appelle une petite fonction pour l'éviter.
on:
  schedule:
    - cron: "17 6 * * 1,4"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Appeler Supabase
        run: |
          URL=$(grep -o 'https://[a-z0-9]*\.supabase\.co' assets/config.js | head -1)
          KEY=$(grep -o 'eyJ[A-Za-z0-9._-]*' assets/config.js | head -1)
          curl -sf -X POST "$URL/rest/v1/rpc/ping" -H "apikey: $KEY" -H "Authorization: Bearer $KEY" -H "Content-Type: application/json" -d '{}'
