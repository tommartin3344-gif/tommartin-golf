name: Mise à jour du Mérite National Amateur

# Le Mérite paraît le premier jeudi du mois (donc au plus tard le 7).
# Passage le 10 à 8 h (heure de Paris en hiver), et un second passage le 12 au cas où la ffgolf aurait été indisponible.
on:
  schedule:
    - cron: "0 7 10,12 * *"
  workflow_dispatch: {}   # bouton « Run workflow » pour lancer à la main

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Récupérer le classement et les résultats
        run: node scripts/update-merite.mjs
      - name: Enregistrer si quelque chose a changé
        run: |
          if git diff --quiet -- data; then
            echo "Rien à enregistrer."
          else
            git config user.name "mise-a-jour-merite"
            git config user.email "actions@users.noreply.github.com"
            git add data
            git commit -m "Mérite : mise à jour automatique $(date +'%Y-%m')"
            git push
          fi
